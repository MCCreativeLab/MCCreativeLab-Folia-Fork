# Upstream-Provenienz: Dieses Repo ist ein Fork von PaperMC/Folia (Branch ver/26.3.x).
# Das Folia-Repo enthaelt aussliesslich Patch-Serien (54 Blobs, keine Quellen); daher ist
# der GitUpstream des paperweight-Patchers wie bei Folia selbst PaperMC/Paper, gepinnt auf
# genau den Paper-Commit, den Folia ver/26.3.x pinned (paperRef oben). Folia's komplette
# Patch-Serien (api 0001-0004, paper-server 0001-0006, minecraft 0001-0011) sind als
# Basisschicht in unsere Patch-Verzeichnisse vendored; MCC-Patches laufen als hoechere
# Nummer (2001+) darueber. foliaUpstream dient nur der Dokumentation.
foliaUpstream=PaperMC/Folia@ver/26.3.x

org.gradle.configuration-cache=true
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.vfs.watch=false

org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
